apiVersion: apps/v1
kind: Deployment
metadata:
  name: gharuka-guru-api
  namespace: gharuka-guru
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gharuka-guru-api
  template:
    metadata:
      labels:
        app: gharuka-guru-api
    spec:
      containers:
      - name: api
        image: ghcr.io/<yourorg>/ghar-ka-guru-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gharuka-guru-env
              key: DATABASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gharuka-guru-env
              key: OPENAI_API_KEY
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: gharuka-guru-env
              key: PINECONE_API_KEY
        - name: PINECONE_ENV
          valueFrom:
            configMapKeyRef:
              name: gharuka-guru-config
              key: PINECONE_ENV
      imagePullSecrets:
      - name: regcred
