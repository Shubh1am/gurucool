# CI/CD Build & Deploy workflow (copy for gurucool folder)
# Required repository secrets:
# - REGISTRY: registry hostname (eg ghcr.io)
# - REGISTRY_USERNAME: registry username
# - REGISTRY_PASSWORD: registry password or PAT
# - IMAGE_NAMESPACE: image namespace/org (eg yourorg)
# - KUBE_CONFIG_DATA: base64-encoded kubeconfig for target cluster

name: CI/CD Build & Deploy

on:
  push:
    branches: [ main ]

env:
  BACKEND_IMAGE: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ghar-ka-guru-backend:latest
  UI_IMAGE: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ghar-ka-guru-ui:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./gurucool
          file: ./gurucool/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          build-args: |
            SERVICE=backend

      - name: Build and push UI image
        uses: docker/build-push-action@v4
        with:
          context: ./gurucool
          file: ./gurucool/Dockerfile
          push: true
          tags: ${{ env.UI_IMAGE }}
          build-args: |
            SERVICE=ui

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'

      - name: Decode kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > kubeconfig

      - name: Create image pull secret (regcred)
        run: |
          echo "Creating image pull secret 'regcred' in namespace gharuka-guru"
          KUBECONFIG=kubeconfig kubectl create namespace gharuka-guru --dry-run=client -o yaml | kubectl apply -f -
          KUBECONFIG=kubeconfig kubectl create secret docker-registry regcred \
            --docker-server=${{ secrets.REGISTRY }} \
            --docker-username=${{ secrets.REGISTRY_USERNAME }} \
            --docker-password=${{ secrets.REGISTRY_PASSWORD }} \
            --namespace=gharuka-guru --dry-run=client -o yaml | KUBECONFIG=kubeconfig kubectl apply -f -

      - name: Replace image placeholders in manifests
        run: |
          sed -i "s|ghcr.io/<yourorg>/ghar-ka-guru-backend:latest|${{ env.BACKEND_IMAGE }}|g" gurucool/k8s/*.yaml || true
          sed -i "s|ghcr.io/<yourorg>/ghar-ka-guru-ui:latest|${{ env.UI_IMAGE }}|g" gurucool/k8s/*.yaml || true

      - name: Apply Kubernetes manifests
        run: |
          KUBECONFIG=kubeconfig kubectl apply -f gurucool/k8s/
